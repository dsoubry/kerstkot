const stories={"Estaminet 0%":{"nl":["Een frisse alcoholvrije pils met een lichte moutigheid, een fijne hopbitterheid en een verkwikkende afdronk.","Een alcoholvrije pils wordt gebrouwen met aandacht voor de typische pilssmaak. De precieze methode waarmee de alcohol wordt beperkt of verwijderd, verschilt per brouwerij.","De naam Estaminet verwijst naar de traditionele Vlaamse herberg, waar buurtbewoners vroeger samenkwamen voor een gesprek en een glas bier. Zulke cafés waren belangrijke ontmoetingsplaatsen in dorpen en steden. Het merk sluit aan bij die Belgische café- en pilscultuur. Pils werd in de loop van de twintigste eeuw bijzonder populair in België. De alcoholvrije uitvoering past bij een recentere ontwikkeling: de vraag naar de vertrouwde biersmaak zonder alcohol. Zo krijgt een klassieke biertraditie een hedendaagse invulling."],"fr":["Une pils sans alcool fraîche, légèrement maltée, avec une fine amertume de houblon et une finale désaltérante.","Une pils sans alcool est élaborée pour préserver le goût typique de la pils. La méthode exacte de réduction ou de retrait de l’alcool varie selon la brasserie.","Le nom Estaminet évoque les anciennes auberges flamandes où les habitants se retrouvaient pour discuter autour d’une bière. Ces cafés étaient des lieux de rencontre essentiels dans les villages et les villes. La marque rappelle cette culture belge du café et de la pils. La pils s’est largement imposée en Belgique au cours du XXe siècle. La version sans alcool répond à une demande plus récente : retrouver le goût de la bière sans alcool. Une tradition conviviale se réinvente ainsi."],"de":["Ein frisches alkoholfreies Pils mit leichter Malznote, feiner Hopfenbittere und erfrischendem Abgang.","Alkoholfreies Pils wird so gebraut, dass der typische Pilsgeschmack erhalten bleibt. Wie der Alkohol begrenzt oder entfernt wird, hängt von der Brauerei ab.","Der Name Estaminet erinnert an traditionelle flämische Gasthäuser, in denen sich Nachbarn auf ein Bier und ein Gespräch trafen. Solche Lokale waren wichtige Treffpunkte in Städten und Dörfern. Die Marke knüpft an die belgische Kneipen- und Pilskultur an. Pils wurde im Laufe des 20. Jahrhunderts in Belgien besonders beliebt. Die alkoholfreie Variante entspricht dem neueren Wunsch nach vertrautem Biergeschmack ohne Alkohol. So erhält eine alte Tradition eine moderne Form."],"en":["A refreshing alcohol-free pilsner with gentle malt notes, delicate hop bitterness and a crisp finish.","Alcohol-free pilsner is made to retain the familiar pilsner character. The precise method used to limit or remove alcohol varies between breweries.","The name Estaminet refers to the traditional Flemish tavern, where neighbours once gathered for conversation and beer. These cafés were important meeting places in towns and villages. The brand evokes Belgium’s café and pilsner culture. Pilsner became especially popular in Belgium during the twentieth century. The alcohol-free version reflects a more recent demand for familiar beer flavours without alcohol. In this way, an old social tradition takes on a modern form."],"it":["Una pils analcolica fresca, con leggere note di malto, delicato amaro di luppolo e finale dissetante.","La pils analcolica viene prodotta per conservare il carattere tipico della pils. Il metodo preciso per limitare o rimuovere l’alcol varia secondo il birrificio.","Il nome Estaminet richiama le tradizionali locande fiamminghe, dove gli abitanti si incontravano per parlare davanti a una birra. Questi locali erano importanti punti di ritrovo nelle città e nei villaggi. Il marchio richiama la cultura belga dei caffè e della pils. La pils divenne molto popolare in Belgio nel corso del Novecento. La versione analcolica risponde alla domanda più recente di gusto autentico senza alcol. Una tradizione conviviale assume così una forma moderna."],"es":["Una pils sin alcohol refrescante, con suaves notas de malta, ligero amargor de lúpulo y final fresco.","La pils sin alcohol se elabora para conservar el carácter típico de una pils. El método concreto para limitar o retirar el alcohol depende de la cervecería.","El nombre Estaminet recuerda las tabernas tradicionales flamencas, donde los vecinos se reunían para conversar y tomar cerveza. Estos locales eran puntos de encuentro importantes en pueblos y ciudades. La marca evoca la cultura belga de los cafés y la pils. La pils se popularizó mucho en Bélgica durante el siglo XX. La versión sin alcohol responde a una demanda más reciente: disfrutar del sabor de la cerveza sin alcohol. Así, una tradición social adquiere una forma moderna."]},"Fruitage 0,0%":{"nl":["Een verfrissende alcoholvrije fruitdrank op bierbasis, met toetsen van rood fruit en een aangename zoetzure balans.","Deze 0,0%-variant sluit aan bij de fruitige Rodenbach-stijl. De exacte productiemethode van deze variant moet aan de hand van de brouwerijgegevens worden bevestigd.","De wortels van Rodenbach liggen in Roeselare, waar de brouwerijgeschiedenis teruggaat tot de negentiende eeuw. De brouwerij werd beroemd om haar Vlaams roodbruine bieren, die hun karakter onder meer danken aan rijping in grote eikenhouten foeders. De combinatie van frisse zuren en fruitige toetsen werd een herkenbaar kenmerk van het huis. De Fruitage-familie bouwt voort op die voorliefde voor fruitige, verfrissende smaken. De alcoholvrije variant past bij de groeiende belangstelling voor alcoholvrije alternatieven. Zo blijft de link met de historische Rodenbach-smaakwereld behouden, in een eigentijdse drank."],"fr":["Une boisson fruitée sans alcool à base de bière, aux notes de fruits rouges et à l’équilibre doux-acidulé.","Cette version à 0,0 % s’inscrit dans le style fruité de Rodenbach. Son procédé exact de fabrication reste à confirmer auprès de la brasserie.","Les racines de Rodenbach se trouvent à Roulers, où l’histoire de la brasserie remonte au XIXe siècle. Elle est devenue célèbre pour ses bières rouges-brunes flamandes, notamment élevées dans de grands foudres de chêne. Leur équilibre entre acidité rafraîchissante et notes fruitées est devenu emblématique. La gamme Fruitage prolonge cette passion pour les saveurs fruitées. La version sans alcool répond à l’intérêt croissant pour les alternatives sans alcool. Elle relie ainsi une tradition historique à une boisson actuelle."],"de":["Ein erfrischendes alkoholfreies Fruchtgetränk auf Bierbasis mit roten Fruchtnoten und ausgewogener Süße und Säure.","Diese 0,0-%-Variante knüpft an den fruchtigen Rodenbach-Stil an. Das genaue Herstellungsverfahren muss noch anhand von Brauereiangaben bestätigt werden.","Die Wurzeln von Rodenbach liegen in Roeselare und reichen bis ins 19. Jahrhundert zurück. Berühmt wurde die Brauerei für flämische rotbraune Biere, deren Charakter auch durch die Reifung in großen Eichenholzfässern entsteht. Die Verbindung von frischer Säure und Fruchtnoten wurde zu ihrem Markenzeichen. Die Fruitage-Reihe greift diese Vorliebe für fruchtige Aromen auf. Die alkoholfreie Variante entspricht dem wachsenden Interesse an Getränken ohne Alkohol. So verbindet sie historische Bierkultur mit heutigem Genuss."],"en":["A refreshing alcohol-free, beer-based fruit drink with red-fruit notes and a pleasant sweet-and-tart balance.","This 0.0% version follows Rodenbach’s fruity style. The exact production method for this variant still needs confirmation from the brewery.","Rodenbach’s roots lie in Roeselare, where the brewery’s history stretches back to the nineteenth century. It became famous for Flemish red-brown beers, whose character is shaped in part by ageing in large oak foeders. Their balance of refreshing acidity and fruity notes became a hallmark of the house. The Fruitage family builds on this fondness for bright fruit flavours. The alcohol-free version responds to growing interest in drinks without alcohol. It offers a contemporary connection to Rodenbach’s historic flavour tradition."],"it":["Una bevanda analcolica alla frutta a base di birra, con note di frutti rossi e piacevole equilibrio dolce-acidulo.","Questa versione 0,0% richiama lo stile fruttato Rodenbach. Il metodo di produzione esatto va ancora confermato con il birrificio.","Le radici di Rodenbach sono a Roeselare e risalgono al XIX secolo. Il birrificio divenne famoso per le birre rosso-brune fiamminghe, il cui carattere nasce anche dalla maturazione in grandi botti di rovere. L’equilibrio tra acidità e note fruttate divenne un tratto distintivo. La linea Fruitage riprende questa passione per i sapori fruttati. La variante analcolica risponde al crescente interesse per bevande senza alcol. Unisce così la tradizione storica a un gusto contemporaneo."],"es":["Una bebida afrutada sin alcohol a base de cerveza, con notas de frutos rojos y agradable equilibrio agridulce.","Esta versión 0,0 % sigue el estilo afrutado de Rodenbach. El método exacto de elaboración debe confirmarse con la cervecería.","Las raíces de Rodenbach están en Roeselare y se remontan al siglo XIX. La cervecería se hizo famosa por sus cervezas rojizas flamencas, cuyo carácter se desarrolla en parte en grandes toneles de roble. Su equilibrio entre acidez refrescante y notas frutales se convirtió en una seña de identidad. La gama Fruitage continúa esa pasión por los sabores afrutados. La variante sin alcohol responde al creciente interés por bebidas sin alcohol. Así conecta una tradición histórica con los gustos actuales."]},"Estaminet":{"nl":["Een frisse Belgische pils met een fijne hopbitterheid en een droge, doordrinkbare afdronk.","Pils wordt met ondergistende gist op koelere temperatuur vergist en daarna koud gelagerd.","Een estaminet was van oudsher een Vlaamse herberg of volkscafé waar mensen samenkwamen na het werk. Het was een plek voor nieuws, kaartspelen, gesprekken en natuurlijk een fris getapt bier. Die sociale cafétraditie vormt de inspiratie achter de naam Estaminet. Het bier behoort tot de Belgische pilstraditie, die in de twintigste eeuw sterk aan populariteit won. Door de opkomst van koeling en moderne brouwtechnieken werd pils een vaste waarde in cafés. Estaminet verbindt die vertrouwde pilsbeleving met de sfeer van de klassieke Vlaamse herberg."],"en":["A refreshing Belgian pilsner with delicate hop bitterness and a crisp, dry finish.","Pilsner is brewed with bottom-fermenting yeast at cooler temperatures, followed by cold maturation.","An estaminet was traditionally a Flemish tavern where people gathered after work. It was a place for news, card games, conversation and a freshly poured beer. That social café culture inspired the name Estaminet. The beer belongs to Belgium’s pilsner tradition, which grew strongly during the twentieth century. Refrigeration and modern brewing helped pilsner become a staple in cafés. Estaminet brings together that familiar beer style and the atmosphere of a classic Flemish inn."],"fr":["Une pils belge fraîche, légèrement amère et à la finale sèche.","Une pils est fermentée à basse température avec une levure de fermentation basse, puis gardée au froid.","Un estaminet était autrefois une auberge flamande où l’on se retrouvait après le travail. On y échangeait des nouvelles, jouait aux cartes et partageait une bière fraîche. Cette tradition conviviale a inspiré le nom Estaminet. La bière s’inscrit dans la tradition belge de la pils, devenue très populaire au XXe siècle. Le développement du froid et des techniques brassicoles modernes a favorisé son succès dans les cafés. Estaminet associe cette bière familière à l’ambiance des anciennes auberges flamandes."],"de":["Ein frisches belgisches Pils mit feiner Hopfenbittere und trockenem Abgang.","Pils wird mit untergäriger Hefe kühl vergoren und anschließend kalt gelagert.","Ein Estaminet war früher ein flämisches Gasthaus, in dem man sich nach der Arbeit traf. Dort wurden Neuigkeiten ausgetauscht, Karten gespielt und frisches Bier getrunken. Diese gesellige Tradition inspirierte den Namen Estaminet. Das Bier gehört zur belgischen Pilstradition, die im 20. Jahrhundert stark an Bedeutung gewann. Kühltechnik und moderne Brauverfahren machten Pils zum festen Bestandteil der Kneipenkultur. Estaminet verbindet diesen Bierstil mit der Atmosphäre alter flämischer Gasthäuser."],"it":["Una pils belga fresca, con delicato amaro di luppolo e finale secco.","La pils è prodotta con lieviti a bassa fermentazione e successiva maturazione a freddo.","Un estaminet era una tradizionale locanda fiamminga dove ci si incontrava dopo il lavoro. Era un luogo per scambiarsi notizie, giocare a carte e bere una birra fresca. Questa cultura conviviale ha ispirato il nome Estaminet. La birra appartiene alla tradizione belga della pils, diventata molto popolare nel Novecento. Refrigerazione e nuove tecniche brassicole ne favorirono la diffusione nei locali. Estaminet unisce questo stile familiare all’atmosfera delle antiche locande fiamminghe."],"es":["Una pils belga refrescante, con amargor suave de lúpulo y final seco.","La pils se elabora con fermentación baja a temperaturas frescas y maduración en frío.","Un estaminet era una taberna flamenca donde la gente se reunía después del trabajo. Allí se compartían noticias, partidas de cartas, conversaciones y cerveza fresca. Esa tradición social inspiró el nombre Estaminet. La cerveza pertenece a la tradición belga de la pils, muy popular desde el siglo XX. La refrigeración y las técnicas modernas ayudaron a extender este estilo por los cafés. Estaminet une esa cerveza conocida con el ambiente de las antiguas tabernas flamencas."]},"Brugge Tripel":{"nl":["Een krachtige, kruidige Belgische tripel met een rijk aroma en een warme afdronk.","Een bier van hoge gisting; de Brugse brouwtraditie is bekend om het gebruik van gruut, een kruidenmengsel.","De Brugse tripelnaam heeft een langere geschiedenis dan het huidige bier. Een Brugse erfgoedpublicatie vermeldt dat brouwerij ’t Hamerken in 1940 al een donkerkleurig bier met de naam Brugse tripel produceerde. Dat was niet noodzakelijk hetzelfde recept als de tripel die we vandaag kennen. In 1983 ontstond uit de brouwerijgeschiedenis van ’t Hamerken De Gouden Boom. Daar werd in 1987 de moderne Brugse Tripel gelanceerd, later bekend als Brugge Tripel. Het bier verwijst met zijn kruidenmengsel gruut naar het middeleeuwse Brugge, waar het Gruuthuse-monopolie een rol speelde in de kruidenhandel voor brouwers. De productie verhuisde later buiten Brugge, maar de band met de stad bleef in naam en karakter bestaan."],"en":["A strong, spicy Belgian tripel with a rich aroma and warming finish.","A top-fermented beer; Bruges brewing heritage is associated with gruut, a blend of herbs.","The Bruges tripel name has a longer history than the beer sold today. A Bruges heritage publication records that the ’t Hamerken brewery was already producing a dark beer called Brugse tripel in 1940. That was not necessarily the same recipe as the modern beer. In 1983, De Gouden Boom emerged from the brewing history of ’t Hamerken. It launched the modern Brugse Tripel in 1987, later known as Brugge Tripel. Its gruut herb blend recalls medieval Bruges, where the Gruuthuse monopoly played a part in supplying brewing herbs. Production later moved away from Bruges, but the beer retained its connection to the city through its name and character."],"fr":["Une triple belge puissante, épicée et à la finale chaleureuse.","Bière de fermentation haute; la tradition brugeoise est liée au gruut, un mélange d’herbes.","Le nom de la triple brugeoise est plus ancien que la bière actuelle. Une publication sur le patrimoine de Bruges indique que la brasserie ’t Hamerken produisait dès 1940 une bière brune appelée Brugse tripel. Il ne s’agissait pas nécessairement de la même recette qu’aujourd’hui. En 1983, la brasserie De Gouden Boom naquit de l’histoire de ’t Hamerken. Elle lança en 1987 la Brugse Tripel moderne, connue plus tard sous le nom de Brugge Tripel. Son mélange d’herbes gruut rappelle le Bruges médiéval, où le monopole Gruuthuse jouait un rôle dans le commerce des herbes brassicoles. La production a ensuite quitté Bruges, mais le lien avec la ville demeure."],"de":["Ein kräftiges, würziges belgisches Tripel mit wärmendem Abgang.","Obergäriges Bier; die Brügger Brautradition kennt Gruut, eine Kräutermischung.","Der Name Brugse Tripel hat eine längere Geschichte als das heutige Bier. Eine Brügger Denkmalschutzpublikation berichtet, dass die Brauerei ’t Hamerken bereits 1940 ein dunkles Bier namens Brugse tripel herstellte. Es muss nicht dasselbe Rezept wie heute gewesen sein. 1983 ging aus der Geschichte von ’t Hamerken die Brauerei De Gouden Boom hervor. Dort wurde 1987 die moderne Brugse Tripel eingeführt, später als Brugge Tripel bekannt. Ihre Kräutermischung Gruut erinnert an das mittelalterliche Brügge, wo das Gruuthuse-Monopol den Handel mit Braukräutern prägte. Die Produktion zog später aus Brügge fort, die Verbindung zur Stadt blieb jedoch bestehen."],"it":["Una tripel belga intensa e speziata, dal finale caldo.","Birra ad alta fermentazione; la tradizione di Bruges è legata al gruut, una miscela di erbe.","Il nome della tripel di Bruges ha una storia più lunga della birra attuale. Una pubblicazione sul patrimonio di Bruges ricorda che già nel 1940 il birrificio ’t Hamerken produceva una birra scura chiamata Brugse tripel. Non era necessariamente la stessa ricetta di oggi. Nel 1983 dalla storia di ’t Hamerken nacque il birrificio De Gouden Boom. Nel 1987 lanciò la moderna Brugse Tripel, in seguito chiamata Brugge Tripel. La miscela di erbe gruut richiama la Bruges medievale, dove il monopolio Gruuthuse aveva un ruolo nel commercio delle erbe per la birra. La produzione si trasferì poi fuori città, ma il legame con Bruges rimase."],"es":["Una tripel belga intensa y especiada, de final cálido.","Cerveza de fermentación alta; la tradición de Brujas está ligada al gruut, una mezcla de hierbas.","El nombre de la tripel de Brujas tiene más historia que la cerveza actual. Una publicación patrimonial de Brujas señala que la cervecería ’t Hamerken ya elaboraba en 1940 una cerveza oscura llamada Brugse tripel. No era necesariamente la misma receta que la actual. En 1983 surgió De Gouden Boom a partir de la historia cervecera de ’t Hamerken. En 1987 lanzó la moderna Brugse Tripel, conocida después como Brugge Tripel. Su mezcla de hierbas gruut recuerda a la Brujas medieval, donde el monopolio Gruuthuse intervenía en el comercio de hierbas para elaborar cerveza. La producción se trasladó más tarde fuera de Brujas, pero se conservó el vínculo con la ciudad."]},"Steenbrugge Blond":{"nl":["Een blond abdijbier met fruitige en kruidige tonen en een zachte bitterheid.","Gebrouwen met hoge gisting; de Steenbrugge-bieren staan bekend om hun kruidige gruutkarakter.","Steenbrugge verwijst naar de Sint-Pietersabdij in de omgeving van Brugge. De geschiedenis van deze abdijbieren is nauw verbonden met het kloosterleven en met de lokale brouwtraditie. In archieven van de abdij zijn documenten bewaard over een brouwerij, patersbier en latere afspraken over de productie. In de twintigste eeuw raakte het bier verbonden met Brugse brouwerijen, waaronder De Gouden Boom. Het gebruik van een kruidenmengsel herinnert aan de oude Brugse gruuttraditie. Steenbrugge Blond houdt zo een stukje abdij- en streekgeschiedenis levend, ook al veranderden de productieplaatsen doorheen de tijd."],"en":["A blonde abbey-style beer with fruity, spicy notes and gentle bitterness.","Top-fermented; Steenbrugge beers are known for their spiced gruut character.","Steenbrugge refers to Saint Peter’s Abbey near Bruges. The history of these abbey beers is closely connected to monastic life and local brewing traditions. Abbey archives preserve documents about a brewery, monks’ beer and later production agreements. During the twentieth century, the beer became associated with Bruges breweries, including De Gouden Boom. Its use of a herbal mixture recalls the old Bruges gruut tradition. Steenbrugge Blond thus keeps part of the region’s abbey and brewing history alive, even as production locations changed."],"fr":["Une bière blonde d’abbaye aux notes fruitées et épicées, légèrement amère.","Fermentation haute et caractère épicé associé au gruut.","Steenbrugge fait référence à l’abbaye Saint-Pierre, près de Bruges. L’histoire de ces bières d’abbaye est étroitement liée à la vie monastique et au brassage local. Les archives de l’abbaye conservent des documents sur une brasserie, la bière des moines et les accords de production ultérieurs. Au XXe siècle, la bière a été associée à des brasseries brugeoises, dont De Gouden Boom. Son mélange d’herbes rappelle l’ancienne tradition brugeoise du gruut. Steenbrugge Blond perpétue ainsi une partie de l’histoire brassicole et monastique de la région."],"de":["Ein blondes Abteibier mit fruchtigen, würzigen Noten und milder Bittere.","Obergärig gebraut, mit einem würzigen Gruut-Charakter.","Steenbrugge verweist auf die Sankt-Peters-Abtei bei Brügge. Die Geschichte dieser Abteibiere ist eng mit dem Klosterleben und der regionalen Brautradition verbunden. In den Abteiarchiven finden sich Unterlagen über eine Brauerei, Mönchsbier und spätere Produktionsvereinbarungen. Im 20. Jahrhundert wurde das Bier mit Brügger Brauereien wie De Gouden Boom verbunden. Eine Kräutermischung erinnert an die alte Brügger Gruut-Tradition. Steenbrugge Blond bewahrt so ein Stück regionaler Kloster- und Braugeschichte, auch wenn die Produktionsorte wechselten."],"it":["Una birra bionda d’abbazia con note fruttate, speziate e amaro delicato.","Alta fermentazione e carattere speziato legato al gruut.","Steenbrugge richiama l’abbazia di San Pietro nei pressi di Bruges. La storia di queste birre d’abbazia è legata alla vita monastica e alla tradizione brassicola locale. Gli archivi conservano documenti su un birrificio, la birra dei monaci e successivi accordi di produzione. Nel Novecento la birra fu associata a birrifici di Bruges, tra cui De Gouden Boom. Una miscela di erbe richiama l’antica tradizione cittadina del gruut. Steenbrugge Blond mantiene così viva una parte della storia monastica e birraria della regione."],"es":["Una cerveza rubia de abadía, afrutada, especiada y de amargor suave.","Fermentación alta y carácter especiado relacionado con el gruut.","Steenbrugge hace referencia a la abadía de San Pedro, cerca de Brujas. La historia de estas cervezas de abadía está ligada a la vida monástica y a la tradición cervecera local. Los archivos conservan documentos sobre una cervecería, cerveza de los monjes y posteriores acuerdos de producción. Durante el siglo XX se vinculó a cervecerías de Brujas, incluida De Gouden Boom. Una mezcla de hierbas recuerda la antigua tradición local del gruut. Steenbrugge Blond mantiene viva parte de la historia monástica y cervecera de la región."]},"Steenbrugge Dubbelbruin":{"nl":["Een donker abdijbier met moutige, karamelachtige en kruidige accenten.","Hoge gisting en donkerdere mouten zorgen voor een volle, ronde smaak.","De naam Steenbrugge is afkomstig van de Sint-Pietersabdij nabij Brugge. Rond de abdij ontstond een traditie van patersbier, waarvan sporen terug te vinden zijn in historische archieven. De abdijbieren werden later ook door commerciële brouwerijen geproduceerd, onder andere door De Gouden Boom in Brugge. Dubbelbruin sluit aan bij de Belgische traditie van donkere, moutige abdijbieren. De verwijzing naar kruiden en gruut verbindt het merk met het middeleeuwse Brugse bierverleden. Zo combineert dit donkere bier een abdijverhaal met de geschiedenis van de Brugse brouwers."],"en":["A dark abbey-style beer with malty, caramel-like and spicy notes.","Top fermentation and darker malts give it a rounded, full-bodied taste.","The name Steenbrugge comes from Saint Peter’s Abbey near Bruges. A tradition of monks’ beer developed around the abbey and is documented in historical archives. The abbey beers were later produced by commercial breweries, including De Gouden Boom in Bruges. Dubbelbruin belongs to Belgium’s tradition of dark, malty abbey-style beers. Its association with herbs and gruut links the brand to medieval brewing in Bruges. This dark beer therefore brings together an abbey story and the city’s brewing heritage."],"fr":["Une bière brune d’abbaye aux accents maltés, caramélisés et épicés.","La fermentation haute et les malts foncés lui donnent une saveur ronde.","Le nom Steenbrugge vient de l’abbaye Saint-Pierre, près de Bruges. Une tradition de bière des moines s’y est développée et apparaît dans les archives historiques. Les bières d’abbaye ont ensuite été produites par des brasseries commerciales, dont De Gouden Boom à Bruges. Dubbelbruin s’inscrit dans la tradition belge des bières d’abbaye brunes et maltées. L’évocation des herbes et du gruut relie la marque au brassage médiéval brugeois. Cette bière brune réunit ainsi histoire monastique et patrimoine brassicole."],"de":["Ein dunkles Abteibier mit malzigen, karamelligen und würzigen Noten.","Obergärung und dunklere Malze sorgen für einen runden Geschmack.","Der Name Steenbrugge stammt von der Sankt-Peters-Abtei bei Brügge. Dort entwickelte sich eine Tradition des Mönchsbiers, die in historischen Archiven dokumentiert ist. Später wurden die Abteibiere auch von kommerziellen Brauereien hergestellt, darunter De Gouden Boom in Brügge. Dubbelbruin steht in der belgischen Tradition dunkler, malziger Abteibiere. Der Bezug zu Kräutern und Gruut verbindet die Marke mit dem mittelalterlichen Brauwesen der Stadt. So vereint dieses dunkle Bier Klostergeschichte und Brügger Brauerbe."],"it":["Una birra scura d’abbazia con note maltate, caramellate e speziate.","Alta fermentazione e malti scuri creano un gusto pieno e rotondo.","Il nome Steenbrugge deriva dall’abbazia di San Pietro vicino a Bruges. Attorno all’abbazia nacque una tradizione di birra dei monaci, documentata negli archivi storici. In seguito queste birre furono prodotte anche da birrifici commerciali, tra cui De Gouden Boom a Bruges. Dubbelbruin appartiene alla tradizione belga delle birre d’abbazia scure e maltate. Il riferimento alle erbe e al gruut lega il marchio alla produzione medievale di Bruges. Questa birra scura unisce così storia monastica e patrimonio brassicolo."],"es":["Una cerveza oscura de abadía con notas de malta, caramelo y especias.","La fermentación alta y las maltas oscuras aportan un sabor redondo.","El nombre Steenbrugge procede de la abadía de San Pedro, cerca de Brujas. Allí surgió una tradición de cerveza de monjes documentada en archivos históricos. Más tarde estas cervezas también fueron elaboradas por cervecerías comerciales, como De Gouden Boom en Brujas. Dubbelbruin pertenece a la tradición belga de cervezas de abadía oscuras y maltosas. La referencia a las hierbas y al gruut conecta la marca con la elaboración medieval de Brujas. Esta cerveza oscura une historia monástica y patrimonio cervecero."]},"Rodenbach Fruitage":{"nl":["Een fruitig, verfrissend bier met roodfruittoetsen en een aangename zoetzure balans.","Gebaseerd op de Rodenbach-traditie van Vlaams roodbruin bier, waarin rijping op grote eikenhouten vaten een belangrijke rol speelt.","Rodenbach is een historische brouwerij uit Roeselare, met wortels in de negentiende eeuw. De familie Rodenbach speelde niet alleen een rol in de bierwereld, maar ook in de Belgische geschiedenis. De brouwerij werd bekend om haar Vlaams roodbruine bieren met gemengde gisting en rijping in grote eikenhouten foeders. Door jonger en ouder bier te combineren ontstaat de karakteristieke balans tussen fruitigheid en friszuur. Rodenbach Fruitage bouwt voort op die herkenbare smaaktraditie met een toegankelijker fruitig karakter. Het is een hedendaagse vertaling van een brouwerserfgoed dat sterk met Roeselare verbonden blijft."],"en":["A refreshing fruit beer with red-fruit notes and a pleasant sweet-and-sour balance.","Rooted in the Rodenbach tradition of Flemish red-brown beer, where maturation in large oak vats plays an important role.","Rodenbach is a historic brewery from Roeselare with roots in the nineteenth century. The Rodenbach family played a part not only in brewing but also in Belgian history. The brewery became known for Flemish red-brown beers made with mixed fermentation and aged in large oak foeders. Blending younger and older beer creates their distinctive balance of fruit and refreshing acidity. Rodenbach Fruitage builds on that flavour tradition with a more approachable fruity character. It is a modern expression of a brewing heritage closely tied to Roeselare."],"fr":["Une bière fruitée et rafraîchissante aux notes de fruits rouges, douce et acidulée.","Inspirée de la tradition Rodenbach des bières rouges-brunes flamandes et de l’élevage en foudres de chêne.","Rodenbach est une brasserie historique de Roulers, dont les racines remontent au XIXe siècle. La famille Rodenbach a marqué non seulement la bière, mais aussi l’histoire belge. La brasserie s’est illustrée par ses bières rouges-brunes flamandes à fermentation mixte, élevées dans de grands foudres de chêne. L’assemblage de bières jeunes et mûres crée leur équilibre fruité et acidulé. Rodenbach Fruitage prolonge cette tradition avec un caractère fruité plus accessible. C’est une interprétation moderne d’un patrimoine brassicole lié à Roulers."],"de":["Ein erfrischendes Fruchtbier mit roten Beeren und süß-säuerlicher Balance.","Es knüpft an die Rodenbach-Tradition flämischer rotbrauner Biere und großer Eichenfässer an.","Rodenbach ist eine traditionsreiche Brauerei aus Roeselare mit Wurzeln im 19. Jahrhundert. Die Familie Rodenbach prägte nicht nur das Brauwesen, sondern auch die belgische Geschichte. Bekannt wurde die Brauerei für flämische rotbraune Biere mit Mischgärung und Reifung in großen Eichenholzfässern. Durch das Verschneiden junger und gereifter Biere entsteht eine Balance aus Frucht und frischer Säure. Rodenbach Fruitage greift diese Tradition mit einem zugänglichen Fruchtcharakter auf. Es ist eine moderne Interpretation des Brauerbes von Roeselare."],"it":["Una birra alla frutta rinfrescante, con frutti rossi e un equilibrio dolce-acidulo.","Si ispira alla tradizione Rodenbach delle birre rosso-brune fiamminghe e delle grandi botti di rovere.","Rodenbach è uno storico birrificio di Roeselare con radici nel XIX secolo. La famiglia Rodenbach ebbe un ruolo sia nel mondo della birra sia nella storia del Belgio. Il birrificio divenne noto per le birre rosso-brune fiamminghe a fermentazione mista, maturate in grandi botti di rovere. La miscela di birre giovani e invecchiate crea il tipico equilibrio tra frutta e acidità. Rodenbach Fruitage riprende questa tradizione con un carattere fruttato più accessibile. È una versione moderna di un patrimonio legato a Roeselare."],"es":["Una cerveza afrutada y refrescante, con frutos rojos y equilibrio agridulce.","Inspirada en la tradición Rodenbach de cervezas rojizas flamencas y grandes toneles de roble.","Rodenbach es una cervecería histórica de Roeselare con raíces en el siglo XIX. La familia Rodenbach destacó tanto en la cerveza como en la historia de Bélgica. La cervecería se hizo famosa por sus cervezas rojizas flamencas de fermentación mixta, maduradas en grandes toneles de roble. Mezclar cerveza joven y envejecida crea su equilibrio entre fruta y acidez refrescante. Rodenbach Fruitage continúa esa tradición con un carácter afrutado más accesible. Es una expresión moderna de un patrimonio muy ligado a Roeselare."]},"Cornet Oaked":{"nl":["Een blond bier met een zachte, ronde smaak en subtiele hout- en vanilletoetsen.","Cornet Oaked is een sterk blond bier waarbij eikenhoutsnippers bijdragen aan het zachte, houtachtige smaakprofiel.","De naam Cornet verwijst naar Theodoor Cornet, de rentmeester van kasteel Diepensteyn in Steenhuffel. Volgens het historische verhaal achter het merk kreeg hij de opdracht een bijzonder bier te laten brouwen voor de heer van het kasteel. Het bier werd in eikenhouten vaten bewaard en was bestemd voor speciale gelegenheden en gasten. Die overlevering inspireerde de moderne brouwers om een blond bier met een zachte houttoets te ontwikkelen. De bekende Cornet Oaked gebruikt daarvoor eikenhoutsnippers tijdens het brouwproces. Het merk verbindt zo een kasteelverhaal met hedendaagse Belgische brouwkunst."],"en":["A blonde beer with a smooth, rounded flavour and subtle woody, vanilla-like notes.","Cornet Oaked is a strong blonde beer in which oak chips contribute to its smooth, subtly woody character.","Cornet is named after Theodoor Cornet, steward of Diepensteyn Castle in Steenhuffel. According to the brand’s historical story, he was asked to arrange a special beer for the castle’s lord. It was kept in oak barrels and served on important occasions to selected guests. That story inspired modern brewers to develop a blonde beer with a gentle woody character. The well-known Cornet Oaked uses oak chips during brewing to achieve this effect. The brand thus connects a castle tale with modern Belgian brewing."],"fr":["Une bière blonde ronde et douce, aux subtiles notes boisées et vanillées.","Cornet Oaked est une bière blonde forte dont les copeaux de chêne contribuent aux arômes doux et boisés.","Cornet porte le nom de Theodoor Cornet, intendant du château de Diepensteyn à Steenhuffel. Selon le récit historique de la marque, il devait faire brasser une bière spéciale pour le seigneur du château. Conservée en fûts de chêne, elle était réservée aux grandes occasions et aux invités. Cette histoire a inspiré une bière blonde moderne aux délicates notes boisées. La célèbre Cornet Oaked utilise des copeaux de chêne pendant le brassage. La marque associe ainsi un récit de château au savoir-faire brassicole belge actuel. La méthode exacte dépend de la variante de Cornet servie."],"de":["Ein mildes, rundes blondes Bier mit feinen Holz- und Vanillenoten.","Cornet Oaked ist ein starkes blondes Bier, dessen Eichenholzchips zu den sanften Holznoten beitragen.","Cornet ist nach Theodoor Cornet benannt, dem Verwalter von Schloss Diepensteyn in Steenhuffel. Der Markenerzählung zufolge sollte er für den Schlossherrn ein besonderes Bier brauen lassen. Es wurde in Eichenfässern gelagert und zu besonderen Anlässen ausgeschenkt. Diese Geschichte inspirierte moderne Brauer zu einem blonden Bier mit feiner Holznote. Beim bekannten Cornet Oaked werden dafür Eichenspäne im Brauprozess eingesetzt. So verbindet die Marke eine Schlossgeschichte mit belgischer Braukunst. Das genaue Verfahren hängt von der jeweiligen Cornet-Sorte ab."],"it":["Una birra bionda morbida e rotonda, con lievi note di legno e vaniglia.","Cornet Oaked è una birra bionda forte in cui i trucioli di rovere contribuiscono alle delicate note legnose.","Cornet prende il nome da Theodoor Cornet, amministratore del castello di Diepensteyn a Steenhuffel. Secondo il racconto storico del marchio, gli fu chiesto di far produrre una birra speciale per il signore del castello. Conservata in botti di rovere, era riservata alle occasioni importanti e agli ospiti. Questa storia ha ispirato una moderna birra bionda con delicate note legnose. La nota Cornet Oaked utilizza trucioli di rovere durante la produzione. Il marchio unisce così un racconto di castello alla birrificazione belga attuale. Il metodo preciso dipende dalla variante servita."],"es":["Una cerveza rubia suave y redonda, con sutiles notas de madera y vainilla.","Cornet Oaked es una cerveza rubia fuerte en la que las virutas de roble aportan suaves notas de madera.","Cornet lleva el nombre de Theodoor Cornet, administrador del castillo de Diepensteyn en Steenhuffel. Según la historia de la marca, recibió el encargo de preparar una cerveza especial para el señor del castillo. Se guardaba en barricas de roble y se servía en ocasiones importantes. Ese relato inspiró a los cerveceros modernos a crear una rubia con suaves notas de madera. La conocida Cornet Oaked utiliza virutas de roble durante la elaboración. La marca une así una historia de castillo con la cervecería belga actual."]}};

function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;}
function setLanguage(code){lang=code;document.documentElement.lang=code;document.querySelectorAll('.lang').forEach(b=>{b.classList.toggle('active',b.dataset.lang===code);b.setAttribute('aria-pressed',String(b.dataset.lang===code));});const t=ui[lang];for(const id of ['sub','depositTitle','depositBody','hint','note','check'])$(id).textContent=t[id];$('search').placeholder=t.search;$('close').textContent=t.close;render();}
function render(){const t=ui[lang],tabs=$('tabs');tabs.replaceChildren();for(const c of ['all',...categoryOrder]){const b=el('button','tab'+(category===c?' active':''),(emoji[c]||'✦')+' '+t[c]);b.type='button';b.onclick=()=>{category=c;render();};tabs.append(b);}const term=$('search').value.trim().toLocaleLowerCase(),root=$('menu');root.replaceChildren();let count=0;for(const c of categoryOrder){if(category!=='all'&&category!==c)continue;const ps=products.filter(p=>p.cat===c&&(p.name+' '+displayName(p)).toLocaleLowerCase().includes(term));if(!ps.length)continue;count+=ps.length;root.append(el('h2','sectionTitle',emoji[c]+' '+t[c]));const grid=el('div','cards');for(const p of ps){const card=el('article','card'),top=el('div','cardTop'),left=el('div');left.append(el('h3','',displayName(p)));if(p.alc!==null)left.append(el('div','alcohol',t.alc+': '+String(p.alc).replace('.',',')+'%'));top.append(left,el('div','price',euro(p.price)));card.append(top);const bd=el('div','breakdown');bd.append(el('span','',p.deposit?`${t.deposit}: ${euro(p.deposit)} · ${t.refundable}`:t.zero),el('strong','',`${t.total}: ${euro(p.price+p.deposit)}`));card.append(bd);if(stories[p.name]){const b=el('button','detail','📖 '+t.detail);b.type='button';b.onclick=()=>showStory(p);card.append(b);}grid.append(card);}root.append(grid);}if(!count)root.append(el('p','noresult','—'));}
function showStory(p){const t=ui[lang],d=stories[p.name],sections=d[lang]||d.nl;$('storyName').textContent=displayName(p);const previous=$('storyText').previousElementSibling;if(previous&&previous.classList.contains('storyPhotoFrame'))previous.remove();if(beerImages[p.name]){const frame=el('div','storyPhotoFrame');const photo=el('img','storyBeerPhoto');photo.src=beerImages[p.name];photo.alt=p.name+' — bierfles';photo.loading='eager';photo.decoding='async';photo.onerror=()=>{if(!photo.dataset.triedRaw){photo.dataset.triedRaw='1';photo.src='https://raw.githubusercontent.com/dsoubry/kerstkot/main/'+beerImages[p.name];return;}photo.remove();const fallback=el('div','storyPhotoFallback',p.name+' — afbeelding momenteel niet beschikbaar');const a=el('a','', 'Open afbeelding op GitHub');a.href='https://github.com/dsoubry/kerstkot/blob/main/'+beerImages[p.name];a.target='_blank';a.rel='noopener noreferrer';a.style.color='#f2ce8b';fallback.append(document.createElement('br'),a);frame.append(fallback);};frame.append(photo);$('storyText').before(frame);}$('storyAbv').textContent=p.alc===null?'':t.alc+': '+String(p.alc).replace('.',',')+'% · '+t.source;const root=$('storyText');root.replaceChildren();[t.taste,t.brew,t.history].forEach((h,i)=>{root.append(el('h3','',h),el('p','',sections[i]));});$('story').showModal();}
$('close').onclick=()=>$('story').close();$('story').addEventListener('click',e=>{if(e.target===$('story'))$('story').close();});$('search').addEventListener('input',render);document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>setLanguage(b.dataset.lang));setLanguage('nl');
</script></body></html>
